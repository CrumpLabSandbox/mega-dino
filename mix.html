<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mix &amp; Match · Mega-Dino</title>
<meta name="description" content="Roll random combinations of dinosaurs, volcanoes and skies: any Mega-Dino scene in front of any Mega-Volcano under any Mega-Clouds sky.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M2 40c10-2 16-10 26-10 4 0 6 2 8 4l4-14c1-5 6-8 12-7l8 3-2 5-10 1-3 14c-1 8-6 12-13 12l1 10h-5l-2-9-6-1-2 10h-5l1-12c-4-2-8-4-12-6z' fill='%23a6d95c'/%3E%3Ccircle cx='51' cy='17' r='1.6' fill='%23122'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
  #view { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; display: block; background: #0c110b; }
  #dock { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 3; display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap;
    background: var(--panel); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid var(--line); border-radius: 18px; padding: 8px; transition: opacity .5s, transform .5s; }
  body.idle #dock, body.idle #top { opacity: 0; pointer-events: none; }
  body.idle #dock { transform: translateY(8px); }
  #top { position: fixed; left: 12px; top: 12px; z-index: 3; display: flex; gap: 6px; transition: opacity .5s; }
  #top .pill { background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); text-decoration: none; color: var(--text); display: inline-flex; align-items: center; }
  .slot { flex: 1 1 190px; min-width: 0; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px 6px 12px; background: rgb(255 255 255 / .04); }
  .slot.locked { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .slot .txt { flex: 1; min-width: 0; line-height: 1.2; }
  .slot small { display: block; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--c); }
  .slot strong, .slot span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot span { color: var(--muted); font-size: 12px; }
  #s-d { --c: var(--accent); } #s-v { --c: var(--accent3); } #s-c { --c: var(--accent2); }
  .slot.off strong { color: var(--muted); font-weight: 400; }
  .slot.roll strong { animation: roll .35s ease; }
  @keyframes roll { from { transform: translateY(-9px); opacity: 0; } to { transform: none; opacity: 1; } }
  .plus { align-self: center; color: var(--muted); font-size: 20px; }
  #b-mix { flex: 0 0 auto; position: relative; overflow: hidden; border: 0; border-radius: 12px; padding: 0 26px; min-height: 52px; font-size: 17px; font-weight: 750; cursor: pointer;
    color: #0c1a06; background: linear-gradient(135deg, #e4f7a0, #a6d95c 55%, #4f9a4a); box-shadow: 0 4px 18px rgb(120 200 80 / .35); }
  #b-mix:hover { filter: brightness(1.08); } #b-mix:active { transform: translateY(1px); }
  #b-mix i { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: rgb(255 255 255 / .75); }
  .opts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .opts select { background: rgb(255 255 255 / .07); border: 1px solid var(--line); border-radius: 999px; padding: 5px 8px; min-height: 34px; max-width: 150px; }
  .opts select option { background: #152014; }
  .opts label.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .icon[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #0c1a06; }
  .icon:disabled { opacity: .35; cursor: default; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; z-index: 2; color: var(--muted); pointer-events: none; transition: opacity .6s; }
  #wait.gone { opacity: 0; }
  #toast { position: fixed; bottom: 96px; z-index: 4; pointer-events: none; }
  /* phones: the picture fills the screen; a small Mix button and a name chip sit in the corners, the rest is a sheet */
  #mini { display: none; }
  @media (max-width: 720px), (max-height: 500px) {
    #view { height: 100dvh; }
    #mini { display: flex; position: fixed; z-index: 3; align-items: flex-end; justify-content: space-between; gap: 10px; pointer-events: none;
      left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); }
    #mini > * { pointer-events: auto; transition: opacity .5s; }
    #m-info { min-width: 0; max-width: min(72vw, 340px); text-align: left; line-height: 1.25; font-size: 12px; padding: 5px 10px; cursor: pointer;
      background: rgb(10 16 10 / .5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px; }
    #m-info span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #m-v { color: var(--accent3); } #m-c { color: var(--accent2); }
    #m-mix { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0; font-size: 21px; cursor: pointer;
      background: conic-gradient(#fff calc(var(--p, 0) * 1%), transparent 0), linear-gradient(135deg, #e4f7a0, #a6d95c 55%, #4f9a4a);
      box-shadow: 0 3px 14px rgb(0 0 0 / .45); display: grid; place-items: center; }
    #m-mix b { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #e4f7a0, #a6d95c 55%, #4f9a4a); font-weight: 400; }
    #m-mix:active { transform: scale(.94); }
    body.idle #m-info { opacity: 0; pointer-events: none; }
    body.idle #m-mix { opacity: .4; }
    #top { left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); }
    #top .pill { min-height: 30px; padding: 3px 10px; font-size: 13px; }
    #dock { display: none; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right));
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 56px); max-height: calc(100dvh - 130px); overflow: auto; }
    body.open #dock { display: flex; }
    #dock #b-mix, .plus { display: none; }
    .slot { flex: 1 1 240px; }
    .opts { flex: 1 1 100%; justify-content: space-between; }
    .opts select { flex: 1 1 130px; max-width: none; }
    #toast { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 62px); font-size: 13px; }
  }
</style>
</head>
<body>
<iframe id="view" title="Mega-Dino" allow="fullscreen"></iframe>
<div id="wait">Waking the dinosaurs…</div>

<nav id="top">
  <a class="pill" href="./" title="All scenes">☰ Gallery</a>
</nav>

<section id="dock" aria-label="Mix and match">
  <div class="slot" id="s-d">
    <div class="txt"><small>Dinosaurs</small><strong id="d-name">…</strong><span id="d-eng"></span></div>
    <button class="icon" id="d-lock" aria-pressed="false" title="Keep these dinosaurs (1)">🔒</button>
    <button class="icon" id="d-roll" title="Other dinosaurs (D)">↻</button>
  </div>
  <span class="plus">+</span>
  <div class="slot" id="s-v">
    <div class="txt"><small>Volcano</small><strong id="v-name">…</strong><span id="v-eng"></span></div>
    <button class="icon" id="v-lock" aria-pressed="false" title="Keep this volcano (2)">🔒</button>
    <button class="icon" id="v-roll" title="Another volcano (V)">↻</button>
    <button class="icon" id="v-off" aria-pressed="false" title="No volcano (X)">✕</button>
  </div>
  <span class="plus">+</span>
  <div class="slot" id="s-c">
    <div class="txt"><small>Clouds</small><strong id="c-name">…</strong><span id="c-eng"></span></div>
    <button class="icon" id="c-lock" aria-pressed="false" title="Keep these clouds (3)">🔒</button>
    <button class="icon" id="c-roll" title="Other clouds (C)">↻</button>
    <button class="icon" id="c-off" aria-pressed="false" title="No clouds (Z)">✕</button>
  </div>
  <button id="b-mix" title="New random combination (Space)">🎲 Mix<i id="bar"></i></button>
  <div class="opts">
    <select id="o-mode" title="How the clouds and the picture are layered" aria-label="Layering">
      <option value="auto">Layering: auto</option>
      <option value="surprise">Layering: surprise me</option>
      <option value="sky">Clouds behind</option>
      <option value="mist">Behind + mist in front</option>
      <option value="over">Clouds on top</option>
      <option value="screen">Screen blend</option>
    </select>
    <select id="o-every" title="Roll a new combination automatically" aria-label="Auto mix">
      <option value="0">Auto: off</option><option value="10">every 10 s</option><option value="20">every 20 s</option>
      <option value="30">every 30 s</option><option value="60">every 1 min</option><option value="120">every 2 min</option>
    </select>
    <label class="chk" title="Also roll the era, the island's life stage, the time of day and the wind"><input type="checkbox" id="o-wild"> Wild</label>
    <button class="icon" id="b-back" title="Previous combination (B)" disabled>↶</button>
    <button class="icon" id="b-link" title="Copy a link to this combination">🔗</button>
    <a class="icon" id="b-open" title="Open this combination in Mega-Dino with all its controls" style="text-decoration:none">⚙</a>
    <button class="icon" id="b-full" title="Full screen (F)">⛶</button>
  </div>
</section>

<div id="mini">
  <button id="m-info" aria-expanded="false" aria-controls="dock" title="Options: lock, reroll one layer, layering, timer"><span id="m-d">…</span><span id="m-v"></span><span id="m-c"></span></button>
  <button id="m-mix" aria-label="New random combination"><b>🎲</b></button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
// Mix & Match: rolls random combinations of a Mega-Dino scene, a Mega-Volcano scene behind it and a Mega-Clouds sky.
// The picture is the main app in a same-origin frame (?ui=0), driven through window.megaDino. Lock a layer to keep
// it and reroll the others; ✕ switches a layer off.
//   mix.html?d=<dino id>&v=<volcano id>&c=<cloud id>&m=<sky|mist|over|screen>&every=<seconds>&wild=1&room=<Invisible Hands room>
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
const frame = $('#view');
const MODES = ['sky', 'mist', 'over', 'screen'];
const SIDES = ['d', 'v', 'c'];
const pick = (list, not) => { const l = list.length > 1 ? list.filter(x => x.id !== not) : list; return l[Math.floor(Math.random() * l.length)]; };

let api = null;
const L = { d: [], v: [], c: [] };          // the scenes each layer can show
let cur = { d: '', v: '', c: '', m: 'auto' };   // the combination on screen
const lock = { d: false, v: false, c: false }, off = { v: false, c: false };
const past = [];
let every = 0, dueAt = 0;

const src = new URLSearchParams({ ui: '0' });
if (q.get('room')) src.set('room', q.get('room'));
if (q.get('d')) src.set('scene', q.get('d'));
frame.src = './?' + src;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

function label() {
  const find = k => L[k].find(s => s.id === cur[k]);
  const none = { d: '…', v: L.v.length ? 'No volcano' : 'Mega-Volcano not available', c: L.c.length ? 'No clouds' : 'Mega-Clouds not available' };
  for (const k of SIDES) {
    const s = find(k), el = $(`#${k}-name`), text = s ? s.name : none[k];
    if (el.textContent !== text) { el.textContent = text; $(`#s-${k}`).classList.remove('roll'); void $(`#s-${k}`).offsetWidth; $(`#s-${k}`).classList.add('roll'); }
    $(`#${k}-eng`).textContent = s ? s.engineName || s.engine : '';
    $(`#s-${k}`).classList.toggle('off', !s);
    $(`#m-${k}`).textContent = s ? (k === 'd' ? '' : '+ ') + s.name : k === 'd' ? '…' : '';
  }
  const names = SIDES.map(find).filter(Boolean).map(s => s.name);
  document.title = (names.length ? names.join(' + ') + ' · ' : '') + 'Mix & Match · Mega-Dino';
  const u = new URLSearchParams();
  for (const k of SIDES) if (cur[k]) u.set(k, cur[k]);
  if (off.v) u.set('v', 'none'); if (off.c) u.set('c', 'none');
  if (cur.m !== 'auto') u.set('m', cur.m);
  if (every) u.set('every', every); if ($('#o-wild').checked) u.set('wild', '1'); if (q.get('room')) u.set('room', q.get('room'));
  history.replaceState(null, '', '?' + u);
  const o = new URLSearchParams({ scene: cur.d }); if (cur.v) o.set('volcano', cur.v); if (cur.c) o.set('clouds', cur.c); if (cur.m !== 'auto') o.set('cmode', cur.m);
  $('#b-open').href = './?' + o;
  $('#b-back').disabled = !past.length;
}

// show a combination; remember the one it replaces
function show(next, remember = true) {
  if (!api) return;
  if (remember && cur.d) { past.push({ ...cur }); if (past.length > 50) past.shift(); }
  if (next.d !== api.scene) api.setScene(next.d);
  if (next.v !== api.volcano) api.setVolcano(next.v);
  if (next.c !== api.clouds || next.m !== cur.m) api.setClouds(next.c, next.m);
  cur = { d: next.d, v: next.v, c: next.c, m: next.m };
  if (next.wild) for (const [k, v] of Object.entries(next.wild)) api.set(k, v);
  dueAt = every ? performance.now() + every * 1000 : 0;
  label();
}
function modeFor() {
  const m = $('#o-mode').value;
  return m === 'surprise' ? ['auto', 'auto', 'mist', 'over', 'screen'][Math.floor(Math.random() * 5)] : m;
}
// a dinosaur scene with open sky when a volcano will stand behind it; a volcano scene with a horizon
const dinoPool = withVolcano => { const open = L.d.filter(s => s.sky); return withVolcano && open.length > 4 ? open : L.d; };
const volcanoPool = () => { const open = L.v.filter(s => s.sky); return open.length > 4 ? open : L.v; };
// what: 'all' respects the locks; 'd', 'v' or 'c' rerolls that layer whatever its lock says
function mix(what = 'all') {
  if (!api) return;
  const roll = k => what === k || (what === 'all' && !lock[k]);
  const newV = L.v.length && !off.v && roll('v'), newC = L.c.length && !off.c && roll('c'), newD = roll('d');
  if (!newD && !newV && !newC) { toast('Everything is locked'); dueAt = every ? performance.now() + every * 1000 : 0; return; }
  const v = off.v ? '' : newV ? pick(volcanoPool(), cur.v).id : cur.v, c = off.c ? '' : newC ? pick(L.c, cur.c).id : cur.c;
  const next = { d: newD ? pick(dinoPool(!!v), cur.d).id : cur.d, v, c, m: newC || !cur.c ? modeFor() : cur.m };
  if ($('#o-wild').checked) {
    next.wild = {};
    if (newD) Object.assign(next.wild, { light: Math.random() < 0.25 ? Math.random() * 0.2 : 0.25 + Math.random() * 0.75, wind: Math.random(), activity: 0.3 + Math.random() * 0.6 });
    if (newD && Math.random() < 0.5) next.wild.stage = 0.02 + Math.random() * 0.85;
    if (newV) next.wild.vstage = 0.15 + Math.random() * 0.6;
  }
  show(next);
}
function back() { const p = past.pop(); if (p) { for (const k of ['v', 'c']) setOff(k, !p[k], false); show(p, false); } }
function setLock(side, on) {
  lock[side] = on;
  $(`#${side}-lock`).setAttribute('aria-pressed', on);
  $(`#s-${side}`).classList.toggle('locked', on);
}
function setOff(side, on, apply = true) {
  off[side] = on; $(`#${side}-off`).setAttribute('aria-pressed', on);
  if (!apply) return;
  if (on) show({ ...cur, [side]: '' }); else mix(side);
}
function full() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }

// the dock fades out when the pointer rests, like the viewer's HUD
let idleT = 0;
function wake() {
  document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(() => { if (!document.body.classList.contains('open') && !$('#dock').matches(':hover, :focus-within')) document.body.classList.add('idle'); }, 3500);
}
// on a phone the dock is a sheet, opened from the name chip
function sheet(on) { document.body.classList.toggle('open', on); $('#m-info').setAttribute('aria-expanded', on); wake(); }

function key(e) {
  if (e.target.matches?.('select, input')) return false;
  if (e.metaKey || e.ctrlKey || e.altKey) return false;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter' || k === 'm') mix();
  else if (k === 'd') mix('d');
  else if (k === 'v') { if (off.v) setOff('v', false); else mix('v'); }
  else if (k === 'c') { if (off.c) setOff('c', false); else mix('c'); }
  else if (k === '1') setLock('d', !lock.d);
  else if (k === '2') setLock('v', !lock.v);
  else if (k === '3') setLock('c', !lock.c);
  else if (k === 'x') setOff('v', !off.v);
  else if (k === 'z') setOff('c', !off.c);
  else if (k === 'b' || k === 'backspace') back();
  else if (k === 'f') full();
  else if (k === 'h') document.body.classList.toggle('idle');
  else return false;
  e.preventDefault(); wake();
  return true;
}

$('#b-mix').onclick = () => mix();
$('#m-mix').onclick = () => { mix(); wake(); };
$('#m-info').onclick = () => sheet(!document.body.classList.contains('open'));
for (const k of SIDES) { $(`#${k}-roll`).onclick = () => { if (off[k]) setOff(k, false); else mix(k); }; $(`#${k}-lock`).onclick = () => setLock(k, !lock[k]); }
$('#v-off').onclick = () => setOff('v', !off.v);
$('#c-off').onclick = () => setOff('c', !off.c);
$('#b-back').onclick = back;
$('#b-full').onclick = full;
$('#b-link').onclick = () => navigator.clipboard?.writeText(location.href).then(() => toast('Link copied'), () => toast(location.href));
$('#o-mode').onchange = () => { if (cur.c) show({ ...cur, m: modeFor() }, false); };
$('#o-every').onchange = e => { every = +e.target.value; dueAt = every ? performance.now() + every * 1000 : 0; label(); };
$('#o-wild').onchange = label;
addEventListener('keydown', key);
for (const ev of ['pointermove', 'pointerdown', 'keydown']) addEventListener(ev, wake, { passive: true });

async function boot() {
  // wait for the app inside the frame
  await new Promise(done => { const t = setInterval(() => { const a = frame.contentWindow?.megaDino; if (a && a.scenes.length && a.scene) { clearInterval(t); api = a; done(); } }, 100); });
  const fw = frame.contentWindow;
  // keys pressed while the picture has focus: ours first, the rest (arrows, pause…) go to the app
  fw.addEventListener('keydown', e => { if (key(e)) e.stopImmediatePropagation(); }, true);
  for (const ev of ['pointermove', 'pointerdown']) fw.addEventListener(ev, wake, { passive: true });
  fw.addEventListener('pointerdown', () => sheet(false), { passive: true });
  L.d = api.scenes;
  const [okV, okC] = await Promise.all([api.loadVolcano(), api.loadClouds()]);
  if (okV) L.v = api.volcanoScenes; if (okC) L.c = api.cloudScenes;
  for (const k of ['v', 'c']) if (!L[k].length) $(`#${k}-lock`).disabled = $(`#${k}-roll`).disabled = $(`#${k}-off`).disabled = true;
  if (!L.c.length) $('#o-mode').disabled = true;
  every = +q.get('every') || 0; $('#o-every').value = String(every); if ($('#o-every').value !== String(every)) every = 0;
  $('#o-wild').checked = q.get('wild') === '1';
  const m = MODES.includes(q.get('m')) ? q.get('m') : 'auto';
  if (m !== 'auto') $('#o-mode').value = m;
  for (const k of ['v', 'c']) if (q.get(k) === 'none') { off[k] = true; $(`#${k}-off`).setAttribute('aria-pressed', true); }
  const want = k => L[k].find(s => s.id === q.get(k));
  const v = off.v || !L.v.length ? '' : (want('v') || pick(volcanoPool())).id, c = off.c || !L.c.length ? '' : (want('c') || pick(L.c)).id;
  show({ d: (want('d') || pick(dinoPool(!!v))).id, v, c, m }, false);
  $('#wait').classList.add('gone');
  wake();
  // follow changes made inside the picture (arrow keys there change the scene or the layers) and run the auto timer
  setInterval(() => {
    if (api.scene !== cur.d || api.volcano !== cur.v || api.clouds !== cur.c) {
      // a layer that is still loading reads as '' for a moment: only follow real changes
      if (api.scene) cur.d = api.scene; if (api.volcano) cur.v = api.volcano; if (api.clouds) cur.c = api.clouds; label();
    }
    const now = performance.now();
    const pct = every && dueAt ? Math.max(0, Math.min(100, 100 - (dueAt - now) / (every * 10))) : 0;
    $('#bar').style.width = pct + '%'; $('#m-mix').style.setProperty('--p', pct.toFixed(1));
    if (every && dueAt && now > dueAt) mix();
  }, 250);
}
boot();
</script>
</body>
</html>
