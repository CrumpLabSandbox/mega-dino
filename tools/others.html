<!doctype html><meta charset="utf-8"><title>flyers and swimmers</title>
<style>body{margin:0;background:#9fc3d8}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// Flyers, swimmers and plants in one sheet, to check swimfly.js and flora.js: tools/others.html?[t=1.3]
import { FLYERS, SWIMMERS } from '../js/species.js';
import { flyParts, swimParts } from '../js/swimfly.js';
import { PLANTS, plantParts, plantPalette } from '../js/flora.js';
import { drawParts, palette } from '../js/draw.js';
const q = new URLSearchParams(location.search), t = +(q.get('t') || 1.3);
const cw = 300, ch = 190, cols = 6; c.width = cols * cw; c.height = ch * 9;
const g = c.getContext('2d'); g.font = '11px system-ui';
let i = 0;
const cell = () => { const x = (i % cols) * cw, y = Math.floor(i / cols) * ch; i++; return [x, y]; };
for (const sp of FLYERS) for (const glide of [0, 1]) { const [x, y] = cell(); drawParts(g, flyParts(sp, { t: t + glide * 0.2, glide }), { x: x + cw / 2, y: y + ch / 2, k: (cw - 40) / sp.span, dir: 1 }, { pal: palette(sp), stroke: 'rgba(0,0,0,.4)', lw: 0.6 }); g.fillStyle = '#123'; g.fillText(`${sp.name} · ${sp.span} m span`, x + 6, y + 12); }
i = Math.ceil(i / cols) * cols;
g.fillStyle = '#2b6f8f'; g.fillRect(0, Math.floor(i / cols) * ch, c.width, ch * 2);
for (const sp of SWIMMERS) { const [x, y] = cell(); drawParts(g, swimParts(sp, { t }), { x: x + cw / 2, y: y + ch / 2, k: (cw - 30) / sp.len, dir: 1 }, { pal: palette(sp), stroke: 'rgba(0,0,0,.4)', lw: 0.6 }); g.fillStyle = '#fff'; g.fillText(`${sp.name} · ${sp.len} m`, x + 6, y + 12); }
i = Math.ceil(i / cols) * cols;
for (const kind of Object.keys(PLANTS)) { const [x, y] = cell(); drawParts(g, plantParts(kind, i * 7, 0.5), { x: x + cw / 2, y: y + ch - 12, k: Math.min(60, (ch - 40) / PLANTS[kind].h / 1.3), dir: 1 }, { pal: plantPalette(1) }); g.fillStyle = '#123'; g.fillText(`${kind} · ${PLANTS[kind].h} m`, x + 6, y + 12); }
window.__done = 1;
</script>
